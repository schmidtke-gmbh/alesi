  .qz-modal{padding:28px 20px}
}

   o:['Nie oder selten','Manchmal','Häufig','Sehr häufig']},
  {qn:5, dim:'D', eyebrow:'Regeneration', q:'Wie erholt fühlst du dich morgens?',
   o:['Sehr erholt','Eher erholt','Eher müde','Sehr müde']},
  {qn:6, dim:'T', eyebrow:'Tagesenergie', q:'Wie häufig fühlst du dich tagsüber müde oder schläfrig?',
   o:['Nie','Selten','Häufiger','Sehr häufig']},
  {qn:7, dim:'T', eyebrow:'Tagesenergie', q:'Wie häufig beeinträchtigt Müdigkeit deine Leistungsfähigkeit oder Motivation am Tag?',
   o:['Nie','Selten','Häufiger','Sehr häufig']},
  {qn:8, dim:'M', eyebrow:'Rhythmus', q:'Wie regelmäßig sind deine Schlaf- und Aufstehzeiten?',
   o:['Sehr regelmäßig','Eher regelmäßig','Wechselhaft','Stark wechselhaft']},
  {qn:9, dim:'E', eyebrow:'Abschalten', q:'Wie häufig fällt es dir abends schwer, mental abzuschalten?',
   o:['Nie','Selten','Häufiger','Sehr häufig']},
  {qn:10, ctx:'koffein', eyebrow:'Gewohnheiten', q:'Wie häufig konsumierst du Koffein am späten Nachmittag oder Abend?',
   o:['Nie','Selten','Häufiger','Sehr häufig']},
  {qn:11, ctx:'alkohol', eyebrow:'Gewohnheiten', q:'Wie häufig trinkst du Alkohol in den Stunden vor dem Schlafengehen?',
   o:['Nie','Selten','Häufiger','Sehr häufig']},
  {qn:12, ctx:'mittel', eyebrow:'Gewohnheiten', q:'Wie häufig nutzt du Schlafmittel oder andere Mittel gezielt zum Einschlafen?',
   o:['Nie','Selten','Häufiger','Sehr häufig']},
  {qn:13, dim:'S', eyebrow:'Zufriedenheit', q:'Wie zufrieden bist du insgesamt mit deinem Schlaf?',
   o:['Sehr zufrieden','Eher zufrieden','Eher unzufrieden','Sehr unzufrieden']}
];
var QMAP = {S:[0,12], M:[2,7], E:[1,8], D:[3,4], T:[5,6]};
var TOTAL_Q = 13;

var FLOW = [{t:'hero'},{t:'name'}]
  .concat(Q.slice(0,5).map(function(q){return {t:'q', q:q};}))
  .concat([{t:'inter1'}])
  .concat(Q.slice(5,9).map(function(q){return {t:'q', q:q};}))
  .concat([{t:'inter2'}])
  .concat(Q.slice(9,13).map(function(q){return {t:'q', q:q};}))
  .concat([{t:'loading'},{t:'gate'},{t:'result'}]);

var state = {i:0, name:'', answers:{}, email:''};

function $app(){ return document.getElementById('qzApp'); }
function esc(s){ return s.replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function personName(pre){ return state.name ? pre + esc(state.name) : ''; }

/* ── Scoring ── */
function computeResult(){
  var dims = {}, k;
  for (k in QMAP){
    var a = VALS[state.answers[QMAP[k][0]]];
    var b = VALS[state.answers[QMAP[k][1]]];
    dims[k] = (a + b) / 2;
  }
  var score = 0;
  for (k in DIMS){ score += dims[k] * DIMS[k].w; }
  score = Math.round(score);
  var hebel = HEBEL_PRIO[0], best = Infinity;
  HEBEL_PRIO.forEach(function(d){ if (dims[d] < best){ best = dims[d]; hebel = d; } });
  var cat = CATS[3];
  for (var c = 0; c < CATS.length; c++){ if (score >= CATS[c].min){ cat = CATS[c]; break; } }
  var hints = [];
  [['koffein',9],['alkohol',10],['mittel',11]].forEach(function(pair){
    if (state.answers[pair[1]] >= 2) hints.push(CTX_HINTS[pair[0]]);
  });
  return {score:score, dims:dims, hebel:hebel, cat:cat, hints:hints};
}

/* ── Progress ── */
function updateProgress(step){
  var wrap = document.getElementById('qzProgress');
  if (!step || !step.q){ wrap.classList.remove('show'); return; }
  wrap.classList.add('show');
  var pct = Math.round((step.q.qn - 1) / TOTAL_Q * 100);
  document.getElementById('qzFill').style.width = pct + '%';
  document.getElementById('qzStep').textContent = 'Frage ' + step.q.qn + ' von ' + TOTAL_Q;
  document.getElementById('qzPct').textContent = pct + '%';
}

    i++;

    el.style.opacity = 0;
    setTimeout(function(){ el.textContent = msgs[i]; el.style.opacity = 1; }, 280);
  }, 900);

function buildResultBody(r, animate){
  var dimRows = ['S','M','E','D','T'].map(function(k){
    var v = Math.round(r.dims[k]);
    return '<div class="qz-dim"><span class="lb">' + DIMS[k].name + '</span>' +
      '<span class="tr"><span class="fl" data-w="' + v + '"' + (animate ? '' : ' style="width:' + v + '%"') + '></span></span>' +
      '<span class="vl">' + v + '<span style="color:var(--muted2);font-weight:300"> / 100</span></span></div>';
  }).join('');
  var hints = r.hints.map(function(h){
    return '<div class="qz-note"><span class="ic">i</span><span><b>' + h.t + ':</b> ' + h.p + '</span></div>';
  }).join('');
  return '' +
  '<div class="qz-result">' +
    '<div class="qz-eyebrow" style="justify-content:center;display:flex">Dein persönlicher Sleep Score' + personName(', ') + '</div>' +
    '<div class="qz-ring">' +
      '<svg viewBox="0 0 200 200"><defs><linearGradient id="qzGrad" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#D2A47D"/><stop offset="1" stop-color="#A5754E"/></linearGradient></defs>' +
      '<circle class="bg" cx="100" cy="100" r="86"/>' +
      '<circle class="fg" id="qzRingFg" cx="100" cy="100" r="86"' + (animate ? '' : ' style="stroke-dashoffset:' + (540.4 * (1 - r.score / 100)) + '"') + '/></svg>' +
      '<div class="num"><span id="qzScoreNum">' + (animate ? '0' : r.score) + '</span><small>VON 100</small></div>' +
    '</div>' +
    '<h2>' + r.cat.head + '</h2>' +
    '<p class="qz-cat">' + r.cat.text + '</p>' +
    '<div class="qz-dims">' + dimRows + '</div>' +
    '<div class="qz-hebel"><div class="he">Dein größter Hebel</div><h3>' + DIMS[r.hebel].name + '</h3><p>' + HEBEL_TEXT[r.hebel] + '</p></div>' +
    hints +
    '<p class="qz-disc">Der Sleep Score ist ein orientierender Selbstcheck und kein validiertes diagnostisches Instrument. Er ersetzt keine ärztliche Diagnose oder Behandlung.</p>' +
    '<!-- ▼ CTA ÄNDERN: Hier verlinkt der Test auf das Webinar. Alternativ z. B. 7-Tage-Schlafcheck oder Newsletter. -->' +

      '<h3>Dein nächster <span class="ac">Schritt</span></h3>' +

      '<a class="btn lg" href="webinar.html">Kostenlosen Platz sichern <span class="arr">→</span></a>' +
      '<p class="sub2">Du willst direkt starten? <a href="kurs.html">Hier geht es zur Durchschlaf-Formel</a></p>' +
    '</div>' +
    '<button class="qz-restart" onclick="qzRestart()">Test neu starten</button>' +
  '</div>';
}

        '<p class="mlead">Trag deine E-Mail-Adresse ein und wir zeigen dir <b>deinen Score, alle fünf Teilbereiche und deinen größten Hebel</b>. Du bekommst dein Ergebnis zusätzlich per E-Mail.</p>' +
        '<!-- ▼ E-MAIL-ANBINDUNG: Formular ist noch nicht angebunden. Vor Livegang mit Newsletter-Tool/CRM verbinden ' +
        '(z. B. per Netlify Forms oder API), Double-Opt-in und Einwilligungstexte rechtlich prüfen. -->' +
        '<form onsubmit="qzEmail(event)">' +
          '<input type="email" id="qzEmailInput" placeholder="deine@email.de" autocomplete="email" required>' +

        '</form>' +

function renderResult(){
  var r = state.result || computeResult();
  $app().innerHTML = '<section class="qz-screen" id="qzResScreen">' + buildResultBody(r, true) + '</section>';
  var C = 540.4;
  requestAnimationFrame(function(){
    setTimeout(function(){
      var fg = document.getElementById('qzRingFg');
      if (fg) fg.style.strokeDashoffset = C * (1 - r.score / 100);
      document.querySelectorAll('#qzResScreen .qz-dim .fl').forEach(function(el, idx){
        setTimeout(function(){ el.style.width = el.getAttribute('data-w') + '%'; }, 250 + idx * 130);
      });
    }, 80);
  });
  var num = document.getElementById('qzScoreNum');
  var t0 = null, DUR = 1600;
  function tick(ts){
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / DUR);
    p = 1 - Math.pow(1 - p, 3);
    num.textContent = Math.round(r.score * p);
    if (p < 1 && document.getElementById('qzScoreNum')) requestAnimationFrame(tick);
  }
  setTimeout(function(){ requestAnimationFrame(tick); }, 300);
  spawnSparks(document.getElementById('qzResScreen'));
  window.scrollTo({top:0, behavior:'smooth'});
}

/* Sternenstaub */
function spawnSparks(host){
  if (!host) return;
  for (var i = 0; i < 22; i++){
    var s = document.createElement('span');
    s.className = 'qz-spark';
    var sz = 2 + Math.random() * 3.5;
    s.style.cssText = 'left:' + (Math.random() * 100) + '%;width:' + sz + 'px;height:' + sz + 'px;' +
      'background:' + (Math.random() > .45 ? 'rgba(210,164,125,.8)' : 'rgba(244,244,242,.6)') + ';' +
      'animation-duration:' + (7 + Math.random() * 9) + 's;animation-delay:' + (Math.random() * 6) + 's';
    host.appendChild(s);
  }
}

/* ── Steuerung ── */
function render(){
  var step = FLOW[state.i];
  updateProgress(step);
  switch (step.t){
    case 'hero': renderHero(); break;
    case 'name': renderName(); break;
    case 'q': renderQuestion(step); break;
    case 'inter1': renderInter1(); break;
    case 'inter2': renderInter2(); break;
    case 'loading': renderLoading(); break;
    case 'gate': renderGate(); break;
    case 'result': renderResult(); break;
  }
  if (step.t !== 'result') window.scrollTo({top:0, behavior:'smooth'});
}

window.qzNext = function(){ if (state.i < FLOW.length - 1){ state.i++; render(); } };
window.qzBack = function(){
  var j = state.i - 1;
  while (j > 0 && ['inter1','inter2','loading'].indexOf(FLOW[j].t) !== -1) j--;
  state.i = Math.max(0, j);
  render();
};
window.qzName = function(ev){
  ev.preventDefault();
  var v = document.getElementById('qzNameInput').value.trim();
  state.name = v.length > 1 && v.length < 24 ? v.charAt(0).toUpperCase() + v.slice(1) : '';
  window.qzNext();
};
window.qzSkipName = function(){ state.name = ''; window.qzNext(); };
window.qzSelect = function(qIdx, optIdx, el){
  state.answers[qIdx] = optIdx;
  el.parentNode.querySelectorAll('.qz-opt').forEach(function(o){ o.classList.remove('sel'); });
  el.classList.add('sel');
  setTimeout(function(){ window.qzNext(); }, 340);
};
window.qzEmail = function(ev){
  ev.preventDefault();
  state.email = document.getElementById('qzEmailInput').value.trim();
  /* ▼ E-MAIL-ANBINDUNG: state.email + state.result hier an Newsletter-Tool/CRM übergeben. */
  window.qzNext();
};
window.qzRestart = function(){ state = {i:0, name:'', answers:{}, email:''}; render(); };

render();
})();
